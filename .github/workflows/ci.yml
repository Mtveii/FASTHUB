name: FastHub CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: '6.9.3'
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  format-and-style:
    name: Code Style (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Validate C++ Formatting
        id: format_check
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find src tests -type f \( -name '*.cpp' -o -name '*.h' \))
          ERRORS=0
          FAILED=""
          for f in "${FILES[@]}"; do
            if ! clang-format --dry-run --Werror --style=file "$f" >/dev/null 2>&1; then
              ERRORS=$((ERRORS + 1))
              FAILED="${FAILED}\n- \`${f}\`"
            fi
          done
          if [ "$ERRORS" -ne 0 ]; then
            echo "::warning::clang-format found ${ERRORS} file(s) with style violations."
            echo "FAILED_FILES=${FAILED}" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "FAILED_FILES=" >> "$GITHUB_ENV"

      - name: Report Formatting Status
        if: always()
        run: |
          {
            echo "### Code Style Check (clang-format)"
            if [ "${{ steps.format_check.outcome }}" == "success" ]; then
              echo ":white_check_mark: **All C++ source files comply with .clang-format specifications.**"
            else
              echo ":warning: **Formatting violations found.**"
              echo -e "${{ env.FAILED_FILES }}"
              echo ""
              echo "> Run \`clang-format -i <file>\` locally to fix formatting issues."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security-audit:
    name: Security & Credential Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret / Credential Leak Check
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanity Check - Hardcoded Tokens & Key Patterns
        id: secret_scan
        run: |
          set +e
          SUSPICIOUS=$(grep -rE "(api_key|secret_key|private_key|password)[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9_\-]{16,}['\"]" src/ || true)
          if [ -z "$SUSPICIOUS" ]; then
            echo "SUSPICIOUS_COUNT=0" >> "$GITHUB_ENV"
          else
            echo "SUSPICIOUS_COUNT=1" >> "$GITHUB_ENV"
            echo "$SUSPICIOUS" > suspicious.txt
          fi

      - name: Report Security Status
        if: always()
        run: |
          {
            echo "### Security & Credential Audit"
            if [ "${{ env.SUSPICIOUS_COUNT }}" == "0" ]; then
              echo ":white_check_mark: **No hardcoded secret keys or tokens detected in \`src/\`.**"
            else
              echo ":rotating_light: **Potential hardcoded secret detected:**"
              echo '```'
              cat suspicious.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build & Test (x64 MSVC, ${{ matrix.build_type }})
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [format-and-style]
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt (${{ env.QT_VERSION }})
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtdeclarative'
          cache: false

      - name: Setup Ninja Build System
        uses: llvm/actions/install-ninja@main

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Ninja, x64 MSVC)
        id: configure
        run: |
          cmake -S . -B build/${{ matrix.build_type }} `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DBUILD_TESTING=ON `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"
        shell: pwsh

      - name: Build Targets
        id: build
        run: cmake --build build/${{ matrix.build_type }} --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        shell: pwsh

      - name: Execute CTest Unit Tests
        id: ctest_execution
        run: |
          ctest --test-dir build/${{ matrix.build_type }} `
            --output-on-failure `
            --output-junit junit-${{ matrix.build_type }}.xml
        shell: pwsh

      - name: Generate Build & Test Step Summary
        if: always()
        run: |
          $testFile = "build/${{ matrix.build_type }}/junit-${{ matrix.build_type }}.xml"
          $summary = "### Build & Test Summary (x64 ${{ matrix.build_type }})`n"
          $summary += "- **Build Target:** Windows x64 (MSVC 2022 + Ninja)`n"
          $summary += "- **Qt Version:** ${{ env.QT_VERSION }}`n"
          $summary += "- **Configuration:** ${{ matrix.build_type }}`n`n"

          if (Test-Path $testFile) {
            [xml]$xml = Get-Content $testFile
            $suite = $xml.testsuite
            $total = [int]$suite.tests
            $failures = if ($suite.failures) { [int]$suite.failures } else { 0 }
            $errors = if ($suite.errors) { [int]$suite.errors } else { 0 }
            $passed = $total - $failures - $errors

            $summary += "#### Test Statistics`n"
            $summary += "| Total Tests | Passed | Failed | Errors |`n"
            $summary += "|:-----------:|:------:|:------:|:------:|`n"
            $summary += "| **$total** | :white_check_mark: $passed | :x: $failures | :warning: $errors |`n"
          } else {
            $summary += ":warning: Test output XML not found.`n"
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        shell: pwsh

      - name: Upload Test Results XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.build_type }}
          path: build/${{ matrix.build_type }}/junit-${{ matrix.build_type }}.xml
          if-no-files-found: ignore

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.build_type }}
          path: build/${{ matrix.build_type }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  package-release:
    name: Package Portable Release (x64)
    runs-on: windows-latest
    needs: [build-and-test]
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt (${{ env.QT_VERSION }})
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtdeclarative'
          cache: false

      - name: Setup Ninja Build System
        uses: llvm/actions/install-ninja@main

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & Build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"
          cmake --build build --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        shell: pwsh

      - name: Deploy Qt Runtime (windeployqt)
        run: |
          windeployqt --release --no-translations `
            --no-system-d3d-compiler --no-opengl-sw `
            build/src/app/FastHub.exe
        shell: pwsh

      - name: Stage & Compress Portable Distribution
        id: stage_package
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/src/app/FastHub.exe dist/
          Get-ChildItem build/src/app -Filter *.dll | Copy-Item -Destination dist
          Copy-Item build/src/app/platforms dist -Recurse -ErrorAction SilentlyContinue
          Copy-Item build/src/app/styles    dist -Recurse -ErrorAction SilentlyContinue
          Copy-Item build/src/app/tls       dist -Recurse -ErrorAction SilentlyContinue

          Compress-Archive -Path dist\* -DestinationPath FastHub-win-x64.zip -Force
          $hash = (Get-FileHash -Path FastHub-win-x64.zip -Algorithm SHA256).Hash
          $hash | Out-File -FilePath FastHub-win-x64.zip.sha256 -Encoding ascii

          $size = [math]::Round((Get-Item FastHub-win-x64.zip).Length / 1MB, 2)
          echo "PACKAGE_SIZE=$size MB" >> $env:GITHUB_ENV
          echo "PACKAGE_SHA256=$hash" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Report Release Artifact Summary
        run: |
          {
            echo "### Portable Release Artifacts (x64)"
            echo "- **Archive Name:** \`FastHub-win-x64.zip\`"
            echo "- **Archive Size:** \`$env:PACKAGE_SIZE\`"
            echo "- **SHA-256 Checksum:** \`$env:PACKAGE_SHA256\`"
            echo ""
            echo '```'
            Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize | Out-String
            echo '```'
          } >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh

      - name: Upload FastHub Standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FastHub-win-x64-standalone
          path: |
            FastHub-win-x64.zip
            FastHub-win-x64.zip.sha256

  arm64-cross-build:
    name: Build Validation (ARM64 Cross-Compile)
    runs-on: windows-latest
    needs: [build-and-test]
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt (ARM64 Cross-compiled)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_arm64_cross_compiled
          modules: 'qtwebengine qtwebchannel qtpositioning qtdeclarative'
          cache: false

      - name: Configure CMake (ARM64 Target)
        id: configure_arm64
        run: |
          cmake -S . -B build-arm64 `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH"
        shell: pwsh

      - name: Build ARM64 Binaries
        id: build_arm64
        run: cmake --build build-arm64 --config Release --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
        shell: pwsh

      - name: Report ARM64 Build Summary
        if: always()
        run: |
          {
            echo "### ARM64 Cross-Compilation Check"
            if ("${{ steps.build_arm64.outcome }}" -eq "success") {
              echo ":white_check_mark: **ARM64 binaries successfully compiled.**"
            } else {
              echo ":warning: **ARM64 cross-compilation encountered warnings/errors.**"
            }
          } >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh

  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [format-and-style, security-audit, build-and-test, package-release, arm64-cross-build]
    if: always()
    steps:
      - name: Render Overall Workflow Status
        run: |
          {
            echo "## FastHub CI/CD Pipeline Results"
            echo "| Job Stage | Status |"
            echo "|:----------|:------:|"
            echo "| Code Style (clang-format) | ${{ needs.format-and-style.result == 'success' && ':white_check_mark: Passed' || ':warning: Warning' }} |"
            echo "| Security & Secret Audit | ${{ needs.security-audit.result == 'success' && ':white_check_mark: Passed' || ':warning: Warning' }} |"
            echo "| Build & Unit Tests (x64) | ${{ needs.build-and-test.result == 'success' && ':white_check_mark: Passed' || ':x: Failed' }} |"
            echo "| Package Release Artifacts | ${{ needs.package-release.result == 'success' && ':white_check_mark: Passed' || ':x: Failed' }} |"
            echo "| ARM64 Cross-Compilation | ${{ needs.arm64-cross-build.result == 'success' && ':white_check_mark: Passed' || ':warning: Non-blocking' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
